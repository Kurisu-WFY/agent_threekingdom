[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-threekingdom"
version = "0.1.0"
description = "San Guo AI Travel Agent backend"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["api", "cli", "config", "db", "domain", "eval_retrieval", "mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]
