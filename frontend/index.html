<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三国文化旅游助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #10243b, #183a56 60%, #1e4d6b);
      color: #e8f0f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    .app {
      width: 100%; max-width: 720px; display: flex; flex-direction: column;
      background: rgba(255,255,255,0.06); border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35); overflow: hidden;
      backdrop-filter: blur(4px); height: 92vh;
    }
    header {
      padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    #chat { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #2f7bbf; border-bottom-right-radius: 0; }
    .bot { align-self: flex-start; background: rgba(255,255,255,0.12); border-bottom-left-radius: 0; }
    .meta { font-size: 11px; opacity: 0.85; margin-top: 8px; color: #bcd7ea; }
    .meta .tag { display:inline-block; background:#254a66; padding:2px 8px; border-radius:6px; margin-right:6px; }
    .loading { opacity: 0.7; font-style: italic; }
    form { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.12); }
    input {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.5); }
    button {
      padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer;
      background: #f0b53c; color: #3a2a00; font-size: 14px; font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🏯 三国文化旅游助手</h1>
      <p>南充 / 阆中 / 广元 · 文化问答 · 路线规划 · 预算票价</p>
    </header>
    <div id="chat"></div>
    <form id="form">
      <input id="input" placeholder="例如：南充一天三国文化路线" autocomplete="off" />
      <button id="send" type="submit">发送</button>
    </form>
  </div>

  <script>
    // 前端由后端挂载在 / 根路径(同源)，用相对路径，任何部署地址下都能正确调用 /chat
    const API = "/chat";
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function add(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function renderStructured(data) {
      // 意图 + 附带的结构化信息
      let meta = "";
      if (data && data.intent && data.intent.intent) {
        meta += '<span class="tag">意图：' + data.intent.intent + '</span>';
      }
      if (data && data.route && data.route.found) {
        const r = data.route.route;
        if (r && r.name) meta += '<span class="tag">路线：' + r.name + '</span>';
      }
      if (data && data.retrieval) {
        meta += '<span class="tag">召回覆盖：' + Math.round((data.retrieval.coverage||0)*100) + '%</span>';
      }
      return meta;
    }

    async function run(message) {
      add(message, "user");
      const bot = add("思考中…", "bot loading");
      sendBtn.disabled = true;
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        bot.classList.remove("loading");
        bot.textContent = data.answer || "(无回答)";
        const meta = renderStructured(data);
        if (meta) {
          const m = document.createElement("div");
          m.className = "meta";
          m.innerHTML = meta;
          bot.appendChild(m);
        }
      } catch (e) {
        bot.classList.remove("loading");
        bot.textContent = "请求失败：" + e.message + "（请确认后端在 http://localhost:8001 运行且已开启 CORS）";
      } finally {
        sendBtn.disabled = false;
      }
    }

    form.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;
      input.value = "";
      run(msg);
    });
  </script>
</body>
</html>
